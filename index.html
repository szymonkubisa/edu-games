<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" data-description content="Darmowe gry edukacyjne dla dzieci 5-8 lat: matematyka i nauka czytania, po polsku i po angielsku. Bez reklam, bez kont, działa offline.">
<meta name="theme-color" content="#F6F1FF">
<meta property="og:title" content="Gry na wesoło — Fun Games">
<meta property="og:description" content="Maths and reading games for early-primary children, in Polish and English. No ads, no accounts, works offline.">
<meta property="og:type" content="website">
<meta property="og:image" content="./icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gry na wesoło</title>
<script type="module" src="/src/entries/menu.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-title>🎈 Gry na wesoło</h1>
    <button data-lang type="button">EN</button>
    <span class="counter" id="starBox">
      <span aria-hidden="true">⭐</span>
      <span id="starN">0</span>
      <span class="visually-hidden" data-stars-label>gwiazdki</span>
    </span>
    <span class="counter practice" id="practiceBox">
      <span aria-hidden="true">📚</span>
      <span id="practiceN">0</span>
      <span class="visually-hidden" data-practice-label>przeczytane</span>
    </span>
  </header>

  <main>
    <nav class="games" data-games aria-label="Gry">
      <a class="game math" href="./matematyka-na-wesolo.html">
        <span class="em" aria-hidden="true">➗</span>
        <span class="name" data-math-name>Matematyka</span>
        <span class="sub" data-math-sub>Dodawaj, odejmuj, mnóż</span>
        <span class="mine" data-math-stars>0 ⭐</span>
      </a>
      <a class="game read" href="./czytanie-na-wesolo.html">
        <span class="em" aria-hidden="true">📖</span>
        <span class="name" data-reading-name>Czytanie</span>
        <span class="sub" data-reading-sub>Historyjki i słowa</span>
        <span class="mine" data-reading-stars>0 ⭐</span>
      </a>
    </nav>

    <section class="panel soft">
      <h2 data-badges-title>🏅 Twoje odznaki</h2>
      <ul class="badges" data-badges></ul>
    </section>

    <p class="about" data-about></p>

    <div class="foot">
      <button class="ghost-btn" data-reset type="button">Wyzeruj postępy</button>
    </div>
  </main>
</div>

<dialog class="confirm" data-reset-dialog>
  <h2 data-reset-title></h2>
  <p data-reset-body></p>
  <div class="row">
    <button data-reset-cancel type="button"></button>
    <button class="danger" data-reset-confirm type="button"></button>
  </div>
</dialog>
</body>
</html>
